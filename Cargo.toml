[workspace]
resolver = "2"
members = [
    "crates/pjn-transport",
    "crates/pjn-wallet",
    "crates/pjn-receiver",
    "crates/pjn-sender",
    "crates/pjn-theater",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/thatzprem/payjoin-nostr"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
